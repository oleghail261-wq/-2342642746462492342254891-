name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TvPowerIR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TvPowerIR-apk
          path: TvPowerIR.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ТВ Пульт (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: Скачайте TvPowerIR.apk на телефон с ИК-портом и установите (разрешите установку из неизвестных источников).
          files: TvPowerIR.apk
